name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar o app
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Clube das Pelucias" com.clube.pelucias --web-dir www
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i '/name="AppTheme.NoActionBar"/a <item name="android:windowFullscreen">true</item>' android/app/src/main/res/values/styles.xml
          sed -i '/name="AppTheme.NoActionBarLaunch"/a <item name="android:windowFullscreen">true</item>' android/app/src/main/res/values/styles.xml
          npx cap sync android

      - name: Compilar o APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: clube-das-pelucias-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
